<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0A1124" />
    <meta name="color-scheme" content="dark" />
    <title>PHYSICA</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <!-- Telegram Mini Apps SDK (Telegram dan tashqarida ham sahifa ishlayveradi) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <div id="splash" class="splash" role="status" aria-live="polite">
      <img src="assets/logo.svg" alt="" width="72" height="72" />
      <div class="splash__name">PHYSICA</div>
      <div class="splash__tagline">Fizikani oʻrganma, uni his qil!</div>
      <div class="spinner" aria-label="Yuklanmoqda"></div>
    </div>

    <div id="app" class="app" hidden>
      <main id="view" class="view" tabindex="-1"></main>
      <nav id="tabbar" class="tabbar" aria-label="Asosiy navigatsiya"></nav>
    </div>

    <div id="sheet-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <noscript>PHYSICA ishlashi uchun JavaScript yoqilgan boʻlishi kerak.</noscript>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
